version: "3.8"

services:
  backend:
    build:
      context: ./project-name
      dockerfile: Dockerfile
    image: itmo_backend:latest
    volumes:
      - ./project-name:/app
    environment:
      - NODE_ENV=production
    networks:
      - itmo_net

  frontend:
    build:
      context: ./my-vue-app
      dockerfile: Dockerfile
    image: itmo_frontend:latest
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - ./my-vue-app:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:3000/video
    networks:
      - itmo_net

networks:
  itmo_net:
    driver: bridge
