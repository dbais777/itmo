version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=itmo_user
      - POSTGRES_PASSWORD=itmo_pass
      - POSTGRES_DB=itmo_db
    volumes:
      - itmo_pgdata:/var/lib/postgresql/data
    networks:
      - itmo_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "itmo_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./project-name
      dockerfile: Dockerfile
    image: itmo_backend:latest
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=itmo_user
      - DATABASE_PASSWORD=itmo_pass
      - DATABASE_NAME=itmo_db
    networks:
      - itmo_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./my-vue-app
      dockerfile: Dockerfile
    image: itmo_frontend:latest
    ports:
      - "8080:8080"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:3000/video
    networks:
      - itmo_net

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - itmo_net
    profiles:
      - admin

networks:
  itmo_net:
    driver: bridge

volumes:
  itmo_pgdata:
